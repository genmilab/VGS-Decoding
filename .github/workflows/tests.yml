name: Inference entry-point checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  entry-points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m py_compile vgs_decoding.py vgs_llavamed_vqarad.py vgs_medgemma_vqarad.py
      - run: python vgs_llavamed_vqarad.py --help
      - run: python vgs_medgemma_vqarad.py --help
